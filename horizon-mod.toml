id = "horizon_qol"
name = "Horizon QoL"
version = "0.1.0"
description = "Quality-of-life tweaks with a client-style mod menu, HUD modules, container previews and Simple Voice Chat compatible voice chat. Press Right Shift in game to open it."
authors = ["dijakonal"]
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins, beside data/ and assets/.
api = "0.2"
# Client only: servers never see this mod, so it works on any server.
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
# The Nightly of 2026-11-20. `cargo horizon-mod update` moves the pin to a newer build.
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# The Mods screen's Config button on this mod opens its own menu, in a world.
[[native.mixin]]
id = "config_button"
target = "horizon_client::game::native_hooks::Game<'_>::native_settings_refresh"
kind = "HEAD"
cancellable = true
helper = "src/mixins/config_button.rs"
bindings = [
  { name = "game", ty = "&mut Game<'_>", value = "&mut *self" },
  { name = "i", ty = "usize", value = "i" },
]

# Voice chat's game-side code (from JKearnsl's Voice Chat, MIT): the audio path, its tick,
# its HUD and the speaking icon on name tags, and its key labels and language.
[[native.module]]
id = "audio"
file = "crates/horizon-client/src/game/network/remote/mod.rs"
name = "voicechat_audio"
source = "src/voice/mixins/audio.rs"

[[native.module]]
id = "key_labels"
file = "crates/horizon-client/src/game/modding/mods/mod.rs"
name = "voicechat_key_labels"
source = "src/voice/mixins/key_labels.rs"

[[native.mixin]]
id = "tick"
target = "horizon_client::game::remote::Game<'_>::tick_remote"
kind = "HEAD"
helper = "src/voice/mixins/tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "language"
target = "horizon_client::game::options::Game<'_>::load_language"
kind = "HEAD"
helper = "src/voice/mixins/language.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "code", ty = "&str", value = "code" },
]

[[native.mixin]]
id = "options"
target = "horizon_client::game::options::Game<'_>::open_options_at"
kind = "HEAD"
helper = "src/voice/mixins/options.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "hud"
target = "horizon_client::game::extras::Game<'_>::draw_extras"
kind = "AFTER_CALL"
selector = "self.native_render_gui_post"
require = 1
ordinal = 0
result = "()"
helper = "src/voice/mixins/hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "$local_mut:corners:0" },
]

[[native.mixin]]
id = "name_tag"
target = "horizon_client::game::names::Game<'_>::styled_name_tag_quads"
kind = "HEAD"
helper = "src/voice/mixins/name_tag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "o", ty = "glam::DVec3", value = "o" },
  { name = "lines", ty = "&[(horizon_client::text::Text, f64)]", value = "lines" },
  { name = "text_alpha", ty = "u32", value = "text_alpha" },
  { name = "background", ty = "bool", value = "background" },
  { name = "text_layer", ty = "u32", value = "text_layer" },
  { name = "light", ty = "u32", value = "light" },
  { name = "unit", ty = "f32", value = "unit" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]

# The Mods screen lists native mods without their icon.png: Horizon QoL's row gets its logo,
# just before each native mod's settings are read (the mods' info is filled in by then).
[[native.mixin]]
id = "mod_icon"
target = "horizon_client::game::native_hooks::Game<'_>::list_native_mods"
kind = "BEFORE_CALL"
selector = "self.native_page_settings"
require = 1
ordinal = 0
helper = "src/mixins/mod_icon.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The Scoreboard module: the sidebar where the HUD editor put it, scaled and restyled.
[[native.mixin]]
id = "scoreboard"
target = "horizon_client::game::scoreboard::Game<'_>::draw_scoreboard"
kind = "HEAD"
cancellable = true
helper = "src/mixins/scoreboard.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
]

# The skin manager: its game side (drawing the picked skin and cape, the account's skin and
# capes through Mojang's API), the hook that draws them, and files dropped on the window.
[[native.module]]
id = "wardrobe"
file = "crates/horizon-client/src/game/network/remote/mod.rs"
name = "qol_wardrobe"
source = "src/mixins/wardrobe_module.rs"

[[native.mixin]]
id = "wardrobe_draw"
# Right after the game settles the frame's skins (update_remote_skins, which can't be patched
# itself: it declares constants inside), every frame.
target = "horizon_client::game::remote::Game<'_>::publish_tab_object_skins"
kind = "HEAD"
helper = "src/mixins/wardrobe_draw.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "file_drop"
target = "horizon_client::game::window_handler::Game<'_>::handle_window_event"
kind = "HEAD"
cancellable = true
helper = "src/mixins/file_drop.rs"
bindings = [
  { name = "event", ty = "&winit::event::WindowEvent", value = "&event" },
]

# The Fullbright module: the renderer's full-light lightmap, on every world and server.
[[native.mixin]]
id = "fullbright"
target = "horizon_client::game::options::Game<'_>::hold_fullbright"
kind = "HEAD"
cancellable = true
helper = "src/mixins/fullbright.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# The Cosmetics module: what its player wears, parsed with the game's item reader (the
# support module beside the game's cosmetics) and put on the player's own model in place of
# the service's answer. Everyone else wears what the service says.
[[native.module]]
id = "cosmetics_module"
file = "crates/horizon-client/src/game/interface/cosmetics/mod.rs"
name = "qol_cosmetics"
source = "src/mixins/cosmetics_module.rs"

[[native.mixin]]
id = "cosmetics"
target = "horizon_client::game::cosmetics::Seat::player_layers"
kind = "MODIFY_VARIABLE"
variable = { name = "worn", ordinal = 0, at = "STORE", parameter = false }
require = 1
helper = "src/mixins/cosmetics.rs"
bindings = [
  { name = "value", ty = "Option<horizon_cosmetics::Worn>", value = "$value" },
  { name = "m", ty = "&PlayerModel", value = "m" },
]

# The same worn list by the name tag: its style's badge, and how tall the items stand.
[[native.mixin]]
id = "cosmetics_tag"
target = "horizon_client::game::cosmetics::Seat::name_decoration"
kind = "MODIFY_VARIABLE"
variable = { name = "worn", ordinal = 0, at = "STORE", parameter = false }
require = 1
helper = "src/mixins/cosmetics_tag.rs"
bindings = [
  { name = "value", ty = "Option<horizon_cosmetics::Worn>", value = "$value" },
  { name = "m", ty = "&PlayerModel", value = "m" },
]

# Inventory Tab Fix: inventories keep Tab and the arrows from the keyboard focus, as a text
# field does (the game's own `key_focus_blocked`), so Tab doesn't select the recipe book.
[[native.mixin]]
id = "tab_fix"
target = "horizon_client::game::pad_menu::keys::Game<'_>::key_focus_blocked"
kind = "RETURN"
helper = "src/mixins/tab_fix.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "blocked", ty = "bool", value = "$value" },
]

# Player Heads: faces in the chat (room made before it draws, faces drawn after) and on the
# locator bar (its dots, as the game lays them out, become faces).
[[native.mixin]]
id = "chat_heads_room"
target = "horizon_client::game::chat::Game<'_>::draw_chat"
kind = "MODIFY_VARIABLE"
variable = { name = "offset", ordinal = 0, at = "LOAD" }
require = 1
helper = "src/mixins/chat_heads_room.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "offset", ty = "[f32; 2]", value = "$value" },
]

[[native.mixin]]
id = "chat_heads_draw"
target = "horizon_client::game::chat::Game<'_>::draw_chat"
kind = "AFTER_CALL"
selector = "self.ui.chat.draw_at"
require = 1
ordinal = 0
result = "()"
helper = "src/mixins/chat_heads_draw.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "now", ty = "f32", value = "$local:now:0" },
  { name = "focused", ty = "bool", value = "$local:focused:0" },
  { name = "offset", ty = "[f32; 2]", value = "$local:offset:0" },
]

[[native.mixin]]
id = "locator_heads"
target = "horizon_client::game::locator_bar::Game<'_>::locator_bar_draws"
kind = "RETURN"
helper = "src/mixins/locator_heads.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "draws", ty = "Vec<horizon_client::hud_layout::GuiDraw>", value = "$value" },
]
